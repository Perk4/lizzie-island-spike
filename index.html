<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lizzie Island</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: linear-gradient(to bottom, #e8ddb5 0%, #FCF2C6 40%);
      font-family: Georgia, serif;
    }
    
    .island {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90vw;
      max-width: 1200px;
      height: 35vh;
      background: #FCF2C6;
      border-radius: 50% 50% 0 0 / 30% 30% 0 0;
      box-shadow: 
        inset 0 20px 60px rgba(121, 102, 53, 0.15),
        0 -4px 20px rgba(87, 53, 28, 0.1);
    }
    
    .island::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      height: 60%;
      background: radial-gradient(ellipse at 30% 40%, rgba(121, 102, 53, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, rgba(121, 102, 53, 0.06) 0%, transparent 40%);
      border-radius: inherit;
    }
    
    .ground-texture {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(165, 83, 45, 0.05) 0%, transparent 8%),
        radial-gradient(circle at 60% 70%, rgba(165, 83, 45, 0.04) 0%, transparent 6%),
        radial-gradient(circle at 80% 85%, rgba(165, 83, 45, 0.03) 0%, transparent 10%),
        radial-gradient(circle at 35% 60%, rgba(121, 102, 53, 0.04) 0%, transparent 5%);
      border-radius: inherit;
    }
    
    .cairn {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 160px;
    }
  </style>
</head>
<body>
  <div class="island">
    <div class="ground-texture"></div>
    <svg class="cairn" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Left twig arm -->
      <path d="M25 75 L8 60 M14 65 L5 55" stroke="#281D0E" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Right twig arm -->
      <path d="M95 75 L112 60 M106 65 L115 55" stroke="#281D0E" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Bottom stone (largest) -->
      <ellipse cx="60" cy="135" rx="50" ry="22" fill="#A5532D" stroke="#281D0E" stroke-width="3"/>
      <!-- Bottom stone spots -->
      <circle cx="35" cy="130" r="3" fill="#57351C" opacity="0.4"/>
      <circle cx="75" cy="138" r="2.5" fill="#57351C" opacity="0.4"/>
      <circle cx="50" cy="142" r="2" fill="#57351C" opacity="0.4"/>
      
      <!-- Middle stone -->
      <ellipse cx="60" cy="95" rx="40" ry="28" fill="#A5532D" stroke="#281D0E" stroke-width="3"/>
      <!-- Face - eyes -->
      <circle cx="48" cy="90" r="4" fill="#281D0E"/>
      <circle cx="72" cy="90" r="4" fill="#281D0E"/>
      <!-- Face - mouth -->
      <path d="M52 102 Q60 108 68 102" stroke="#281D0E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Top stone (smallest, olive) -->
      <ellipse cx="60" cy="50" rx="28" ry="20" fill="#796635" stroke="#281D0E" stroke-width="3"/>
      <!-- Top stone spots -->
      <circle cx="50" cy="45" r="2.5" fill="#57351C" opacity="0.5"/>
      <circle cx="70" cy="48" r="2" fill="#57351C" opacity="0.5"/>
      <circle cx="58" cy="55" r="2" fill="#57351C" opacity="0.5"/>
    </svg>
  </div>
</body>
</html>
